spring.application.name=lollapalooza
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html

spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lollapalooza}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root_pwd}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=falsedocker